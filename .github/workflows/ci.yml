name: CI and npm release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.13.0', '24']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  release:
    name: Publish to npm
    needs: check
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'elmenov-softworks/eslint-plugin-between'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Select release source or resume a failed publication
        id: source
        shell: bash
        run: |
          git fetch origin master
          latest=$(git rev-parse origin/master)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "resume=false" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-parse "$latest^")" = "$GITHUB_SHA" ] &&
            git log -1 --format=%B "$latest" | grep -Fxq "Source: $GITHUB_SHA"; then
            git checkout --detach "$latest"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "resume=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "A newer master commit superseded this run; its checks will release the changes." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v6
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        if: steps.source.outputs.ready == 'true'
        run: npm install --global npm@11

      - name: Install dependencies
        if: steps.source.outputs.ready == 'true'
        run: npm ci

      - name: Bump patch version
        if: steps.source.outputs.ready == 'true' && steps.source.outputs.resume != 'true'
        run: npm version patch --no-git-tag-version

      - name: Check the versioned package
        if: steps.source.outputs.ready == 'true'
        run: npm run check

      - name: Commit and tag the release
        if: steps.source.outputs.ready == 'true' && steps.source.outputs.resume != 'true'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/plugin.constants.ts
          git commit -m "chore(release): v$version" -m "Source: $GITHUB_SHA"
          git tag "v$version"
          git push --atomic origin HEAD:refs/heads/master "refs/tags/v$version"

      - name: Check whether the version is already published
        if: steps.source.outputs.ready == 'true'
        id: registry
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`Registry check failed: HTTP ${response.status}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.status === 200}\n`);
          JS

      - name: Publish with OIDC
        if: steps.source.outputs.ready == 'true' && steps.registry.outputs.published != 'true'
        run: npm publish --access public --registry https://registry.npmjs.org
